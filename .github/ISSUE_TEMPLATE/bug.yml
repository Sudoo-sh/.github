name: Something does not work
description: A problem with Sudoo.sh or one of its sites
labels: [fix]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
  - type: input
    id: version
    attributes:
      label: Version or page
